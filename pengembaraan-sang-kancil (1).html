function closeDialog(){states[pageIndex].dialog='';$('#dialog')?.classList.remove('show');}
function showFeedback(text,retry=false){clearTimeout(feedbackTimer);const el=$('#feedback');if(!el)return;el.textContent=text;el.classList.toggle('retry',retry);el.classList.add('show');announce(text);feedbackTimer=setTimeout(()=>el.classList.remove('show'),2300);}
function act(el,effect){['wave','look','shy','dance','surprised'].forEach(c=>el.classList.remove(c));void el.offsetWidth;el.classList.add(effect==='happy'?'dance':effect);if(effect==='happy')el.classList.add('happy');}
function clickActor(id){if(turning)return;const el=$(`[data-actor="${id}"]`),s=states[pageIndex];
 if(!pageIndex){act(el,id==='kancil'?'wave':'dance');showDialog('Jom pergi ke tepi sungai!');return;}
 const p=pages[pageIndex],a=p.steps[s.step];
 if(a.type==='click'&&a.actor===id){act(el,a.action);showDialog(a.text);completeStep(s.step);return;}
 // Klik watak lain tetap memberikan aksi, tanpa mengubah urutan cerita.
 const clickStep=p.steps.find(x=>x.type==='click'&&x.actor===id);
 if(clickStep&&!(pageIndex===3&&!s.moved)&&!(pageIndex===4&&!s.moved)){act(el,clickStep.action);showDialog(clickStep.text);}
 else if(id===p.steps.find(x=>x.type==='drag').actor&&!s.moved){act(el,'wave');showDialog('Tekan dan tahan saya. Seret ke tempat bercahaya.');}
 else{act(el,'dance');showDialog(pageIndex===1?'Jom pergi ke tepi sungai!':pageIndex===2?'Di manakah bekal kita?':pageIndex===3?'Mari lihat di belakang pokok.':'Mari makan bersama-sama!');}
}
// POINTER EVENTS menyokong tetikus, jari dan stylus tanpa pustaka luar.
function bindActor(el){el.addEventListener('pointerdown',e=>{
 if(turning||$('#modalBackdrop').classList.contains('open')||e.button!==0||drag)return;
 const id=el.dataset.actor,s=states[pageIndex],a=pageIndex?pages[pageIndex].steps[s.step]:null;
 const movable=!!(a&&a.type==='drag'&&a.actor===id&&!s.done[s.step]);
 drag={el,id,pointer:e.pointerId,startX:e.clientX,startY:e.clientY,startLeft:parseFloat(el.style.left),startTop:parseFloat(el.style.top),movable,moved:false,page:pageIndex};
 el.setPointerCapture(e.pointerId);e.preventDefault();
 });
 el.addEventListener('pointermove',e=>{if(!drag||drag.el!==el||e.pointerId!==drag.pointer)return;const dx=(e.clientX-drag.startX)/scale,dy=(e.clientY-drag.startY)/scale;
 if(Math.hypot(dx,dy)>7)drag.moved=true;if(!drag.movable||!drag.moved)return;
 if(!el.classList.contains('dragging')){closeDialog();el.classList.remove('wave','look','shy','dance');el.classList.add('dragging');}
 const maxX=650-el.offsetWidth,maxY=457-el.offsetHeight;
 el.style.left=Math.max(0,Math.min(maxX,drag.startLeft+dx))+'px';el.style.top=Math.max(8,Math.min(maxY,drag.startTop+dy))+'px';e.preventDefault();
 });
 el.addEventListener('pointerup',e=>finishPointer(e,false));el.addEventListener('pointercancel',e=>finishPointer(e,true));
 el.addEventListener('lostpointercapture',e=>{if(drag&&drag.pointer===e.pointerId)finishPointer(e,true);});
 el.addEventListener('click',e=>{if(e.detail===0&&!drag)clickActor(el.dataset.actor);});
 el.addEventListener('keydown',e=>keyboardActor(el,e));
}
function finishPointer(e,cancelled){if(!drag||e.pointerId!==drag.pointer)return;const d=drag;drag=null;
 if(d.el.hasPointerCapture(d.pointer))d.el.releasePointerCapture(d.pointer);d.el.classList.remove('dragging');
 if(cancelled){returnActor(d);return;}
 if(!d.moved){clickActor(d.id);return;}if(!d.movable)return;
 const a=pages[pageIndex].steps[states[pageIndex].step];
 const feet=[parseFloat(d.el.style.left)+d.el.offsetWidth/2,parseFloat(d.el.style.top)+d.el.offsetHeight*.86];
 if(Math.hypot((feet[0]-a.target[0])/1.5,feet[1]-a.target[1])<67)successfulDrop(d.el,a);else{ returnActor(d);showFeedback('Cuba lagi.',true);}
}
function returnActor(d){d.el.style.left=d.startLeft+'px';d.el.style.top=d.startTop+'px';}
function successfulDrop(el,a){const s=states[pageIndex],step=s.step;s.moved=true;s.positions[a.actor]=a.dest.slice();el.style.left=a.dest[0]+'px';el.style.top=a.dest[1]+'px';
 if(pageIndex===2)$('.bush').classList.add('open');
 if(pageIndex===3){$('#scene').classList.add('discovered');$('.big-tree').classList.add('revealed');}
 if(pageIndex===4){$('.held-basket')?.remove();$('#scene').insertAdjacentHTML('beforeend',picnicHTML());
  Object.entries({kancil:[230,223],rabbit:[352,211],fox:[470,224]}).forEach(([id,pos])=>{s.positions[id]=pos;const b=$(`[data-actor="${id}"]`);b.style.left=pos[0]+'px';b.style.top=pos[1]+'px';b.classList.add('sit','happy');});
 }
 act(el,a.action);showDialog(a.text);completeStep(step);
}
function keyboardActor(el,e){if(!pageIndex||turning)return;const a=pages[pageIndex].steps[states[pageIndex].step];if(a.type!=='drag'||a.actor!==el.dataset.actor||states[pageIndex].done[states[pageIndex].step])return;
 const arrows={ArrowLeft:[-18,0],ArrowRight:[18,0],ArrowUp:[0,-18],ArrowDown:[0,18]};
 if(arrows[e.key]){e.preventDefault();closeDialog();el.style.left=Math.max(0,Math.min(650-el.offsetWidth,parseFloat(el.style.left)+arrows[e.key][0]))+'px';el.style.top=Math.max(8,Math.min(457-el.offsetHeight,parseFloat(el.style.top)+arrows[e.key][1]))+'px';}
 if(e.key==='Enter'){e.preventDefault();const feet=[parseFloat(el.style.left)+el.offsetWidth/2,parseFloat(el.style.top)+el.offsetHeight*.86];if(Math.hypot((feet[0]-a.target[0])/1.5,feet[1]-a.target[1])<67)successfulDrop(el,a);else{const pos=pages[pageIndex].actors[a.actor];el.style.left=pos[0]+'px';el.style.top=pos[1]+'px';showFeedback('Cuba lagi.',true);}}
}
function resetPage(){if(turning||!pageIndex)return;cancelDrag();states[pageIndex]=freshState();renderPage(true);announce('Aktiviti diulang. '+pages[pageIndex].steps[0].instruction);}
function cancelDrag(){if(drag){const d=drag;drag=null;d.el.classList.remove('dragging');if(d.el.hasPointerCapture(d.pointer))d.el.releasePointerCapture(d.pointer);}}
function navigate(next){if(turning||next===pageIndex)return;cancelDrag();closeModal(false);closeDialog();turning=true;const sheet=$('#turnSheet');sheet.className='turn-sheet '+(next>pageIndex?'forward':'backward');
 setTimeout(()=>{pageIndex=next;renderPage(true);announce(next?`Muka Surat ${next} daripada 4. ${pages[next].title}`:'Kulit Hadapan');},230);
 setTimeout(()=>{sheet.className='turn-sheet';turning=false;},580);
}
$('#homeBtn').addEventListener('click',()=>navigate(0));$('#backBtn').addEventListener('click',()=>navigate(Math.max(0,pageIndex-1)));
$('#nextBtn').addEventListener('click',()=>{if(pageIndex===4){for(let i=0;i<states.length;i++)states[i]=freshState();navigate(0);}else navigate(pageIndex+1);});
function openModal(kind,title,content){modalFocus=document.activeElement;$('#modalEyebrow').textContent=kind;$('#modalTitle').textContent=title;$('#modalText').innerHTML=content;$('#modal').classList.toggle('modal-help',kind==='PANDUAN');$('#modalBackdrop').classList.add('open');$('#modalClose').focus();}
function openMeaning(key){openModal('MAKSUD SIMPULAN BAHASA',key,`<p>${meanings[key]}</p>`);announce(meanings[key]);}
function openHelp(){openModal('PANDUAN','Jom cuba aktiviti!',`<p class="help-line">${icons.hand}<span>Klik watak untuk melihat aksinya.</span></p><p class="help-line">${icons.drag}<span>Tekan dan tahan watak. Seret ke tempat bercahaya. Kemudian, lepaskan.</span></p><small>Kamu boleh terus membaca dengan butang “Seterusnya”.</small>`);}
function closeModal(focus=true){if(!$('#modalBackdrop').classList.contains('open'))return;$('#modalBackdrop').classList.remove('open');if(focus&&modalFocus?.isConnected)modalFocus.focus();}
$('#helpBtn').addEventListener('click',openHelp);$('#modalClose').addEventListener('click',()=>closeModal());$('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeModal();});
document.addEventListener('keydown',e=>{if($('#modalBackdrop').classList.contains('open')){if(e.key==='Escape')closeModal();if(e.key==='Tab'){e.preventDefault();$('#modalClose').focus();}return;}if(e.key==='Escape')closeDialog();});
// SATU LAGU INSTRUMENTAL ASLI: melodi lembut disintesis setempat.
// AudioBufferSourceNode berulang dengan tepat; navigasi tidak menyentuh audio.
let audioCtx=null,musicSource=null,musicOn=false,musicBusy=false;
function composeMusic(ctx){
 const rate=22050,beat=.625,bars=16,duration=bars*4*beat,buffer=ctx.createBuffer(1,Math.round(duration*rate),rate),samples=buffer.getChannelData(0);
 const melody=[[76,79,81,79],[76,74,72,74],[76,79,83,81],[79,76,74,72],[77,81,84,81],[79,77,76,74],[76,79,81,79],[76,74,72,72]];
 const chords=[[60,64,67],[55,59,62],[57,60,64],[53,57,60]];
 function note(midi,start,length,amp,soft=false){const f=440*Math.pow(2,(midi-69)/12),first=Math.round(start*rate),count=Math.round(length*rate);for(let j=0;j<count&&first+j<samples.length;j++){const t=j/rate,attack=Math.min(1,t/.025),tail=Math.min(1,(length-t)/.14),envelope=attack*Math.max(0,tail)*Math.exp(-t*(soft?1.45:3.1));samples[first+j]+=amp*envelope*(Math.sin(2*Math.PI*f*t)+.19*Math.sin(4*Math.PI*f*t)+.06*Math.sin(6*Math.PI*f*t));}}
 for(let bar=0;bar<bars;bar++){const start=bar*4*beat;const phrase=melody[bar%8];phrase.forEach((m,i)=>note(m,start+i*beat,beat*1.35,.13));chords[bar%4].forEach(m=>note(m,start,beat*3.95,.025,true));note(chords[bar%4][0]-12,start,beat*1.8,.055,true);note(chords[bar%4][0]-12,start+2*beat,beat*1.8,.037,true);}
 // Lembutkan sempadan gelung untuk mengelakkan bunyi klik.
 const fade=Math.round(.009*rate);for(let i=0;i<fade;i++){samples[i]*=i/fade;samples[samples.length-1-i]*=i/fade;}return buffer;
}
async function toggleMusic(){if(musicBusy)return;musicBusy=true;const btn=$('#musicBtn');try{
  if(!audioCtx){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw new Error('Audio tidak tersedia');audioCtx=new Audio();musicSource=audioCtx.createBufferSource();musicSource.buffer=composeMusic(audioCtx);musicSource.loop=true;const volume=audioCtx.createGain();volume.gain.value=.4;musicSource.connect(volume);volume.connect(audioCtx.destination);musicSource.start();}
  if(musicOn){await audioCtx.suspend();musicOn=false;}else{await audioCtx.resume();musicOn=true;}
  btn.setAttribute('aria-pressed',String(musicOn));btn.querySelector('span').textContent=musicOn?'Tutup Lagu':'Buka Lagu';announce(musicOn?'Lagu dibuka.':'Lagu ditutup.');
 }catch(err){musicOn=false;btn.setAttribute('aria-pressed','false');btn.querySelector('span').textContent='Buka Lagu';if(audioCtx){audioCtx.close().catch(()=>{});audioCtx=null;musicSource=null;}openModal('LAGU LATAR','Lagu belum dapat dimainkan','<p>Sila cuba butang “Buka Lagu” sekali lagi dalam pelayar yang menyokong audio.</p>');}
 finally{musicBusy=false;}
}
$('#musicBtn').addEventListener('click',toggleMusic);
renderPage();
</script>
